# Esegue i test, genera la Javadoc e la pubblica su GitHub Pages.
name: Javadoc su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  javadoc:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Se un test fallisce la documentazione non viene pubblicata
      - name: Test e Javadoc
        run: mvn -B test javadoc:javadoc

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/reports/apidocs

      - id: deploy
        uses: actions/deploy-pages@v4
